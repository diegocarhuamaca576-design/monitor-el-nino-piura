name: Actualizacion Automatica Monitor El Nino

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias necesarias
        run: |
          pip install requests pandas numpy

      - name: Ejecutar script de actualizacion
        run: |
          python actualizar_datos.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Monitor El Nino Bot"
          git add datos_monitor.json peru_nacional_2000_2026.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualizacion datos climaticos $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)